name: Daily Content Scrape

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
  INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mr-nerf-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: mr-nerf-dashboard
        run: npm ci

      - name: Run scrapers
        working-directory: mr-nerf-dashboard
        run: npx tsx src/lib/scrapers/run.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily scrape failed! Check the logs above for details."
          # Optional: Send Discord webhook notification
          # curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"content": "Daily scrape failed! Check GitHub Actions for details."}'
