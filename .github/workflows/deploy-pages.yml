name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/deploy-for-review-OMSvj"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mr-nerf-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mr-nerf-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Remove API routes (incompatible with static export)
        run: rm -rf src/app/api

      - name: Build with Next.js (static export for GitHub Pages)
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /random

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mr-nerf-dashboard/out
